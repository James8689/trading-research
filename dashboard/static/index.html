<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opportunity Engine</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div id="login" class="login hidden">
    <form id="login-form" class="login-card">
      <p class="eyebrow">James only</p>
      <h1>Opportunity Engine</h1>
      <p class="muted">Research control plane. No broker. No paid dispatch until you set an allowance.</p>
      <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Enter</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>

  <div id="app" class="hidden">
    <header>
      <div class="brand">
        <strong>Opportunity Engine</strong>
        <span class="pill" id="mode-pill">manual</span>
        <span class="pill warn" id="spend-pill">spend</span>
      </div>
      <nav>
        <button data-view="home" class="active">Mission</button>
        <button data-view="roles">Roles</button>
        <button data-view="families">Families</button>
        <button data-view="spend">Spend</button>
        <button data-view="orchestrator">Orchestrator</button>
        <button data-view="audit">Audit</button>
      </nav>
      <button id="logout" class="ghost">Sign out</button>
    </header>
    <main id="main"></main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
